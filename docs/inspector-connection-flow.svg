@keyframes p12{0%,74.101%{opacity:0;transform:translateX(555px)}74.388%,77.158%{opacity:1}77.698%,100%{opacity:0;transform:translateX(125px)}}#p12{animation:p12 27.800000000000008s linear infinite}
