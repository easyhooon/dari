</style>
<rect x="40" y="50" width="170" height="170" rx="12" class="box"/><text class="t fg" x="125" y="76" text-anchor="middle" dominant-baseline="central">Desktop app</text><text class="s mut" x="125" y="96" text-anchor="middle" dominant-baseline="central">java.net.Socket</text>
<rect x="255" y="50" width="170" height="170" rx="12" class="tun"/><text class="t fg" x="340" y="76" text-anchor="middle" dominant-baseline="central">adb tunnel</text><text class="s mut" x="340" y="96" text-anchor="middle" dominant-baseline="central">USB</text>
<rect x="470" y="50" width="170" height="170" rx="12" class="box"/><text class="t fg" x="555" y="76" text-anchor="middle" dominant-baseline="central">Android app</text><text class="s mut" x="555" y="96" text-anchor="middle" dominant-baseline="central">LocalServerSocket</text>
<line class="lane" x1="210" y1="175" x2="470" y2="175"/>
<g id="p0" opacity="0"><rect x="-74.8" y="161" width="149.6" height="28" rx="6" fill="#888780" fill-opacity=".18" stroke="#888780" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">cat /proc/net/unix</text></g>
<g id="p1" opacity="0"><rect x="-71.2" y="161" width="142.4" height="28" rx="6" fill="#888780" fill-opacity=".18" stroke="#888780" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">@dari_com.example</text></g>
<g id="p2" opacity="0"><rect x="-56.800000000000004" y="161" width="113.60000000000001" height="28" rx="6" fill="#888780" fill-opacity=".18" stroke="#888780" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">forward tcp:0</text></g>
<g id="p3" opacity="0"><rect x="-35" y="161" width="70" height="28" rx="6" fill="#888780" fill-opacity=".18" stroke="#888780" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">51234</text></g>
<g id="p4" opacity="0"><rect x="-42.4" y="161" width="84.8" height="28" rx="6" fill="#7F77DD" fill-opacity=".18" stroke="#7F77DD" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">connect()</text></g>
<g id="p5" opacity="0"><rect x="-60.4" y="161" width="120.8" height="28" rx="6" fill="#7F77DD" fill-opacity=".18" stroke="#7F77DD" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">ClientHello v1</text></g>
<g id="p6" opacity="0"><rect x="-60.4" y="161" width="120.8" height="28" rx="6" fill="#1D9E75" fill-opacity=".18" stroke="#1D9E75" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">ServerHello ok</text></g>
<g id="p7" opacity="0"><rect x="-71.2" y="161" width="142.4" height="28" rx="6" fill="#7F77DD" fill-opacity=".18" stroke="#7F77DD" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Invoke #1 observe</text></g>
<g id="p8" opacity="0"><rect x="-64" y="161" width="128" height="28" rx="6" fill="#1D9E75" fill-opacity=".18" stroke="#1D9E75" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Result #1 added</text></g>
<g id="p9" opacity="0"><rect x="-71.2" y="161" width="142.4" height="28" rx="6" fill="#1D9E75" fill-opacity=".18" stroke="#1D9E75" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Result #1 updated</text></g>
<g id="p10" opacity="0"><rect x="-60.4" y="161" width="120.8" height="28" rx="6" fill="#7F77DD" fill-opacity=".18" stroke="#7F77DD" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Invoke #2 list</text></g>
<g id="p11" opacity="0"><rect x="-64" y="161" width="128" height="28" rx="6" fill="#1D9E75" fill-opacity=".18" stroke="#1D9E75" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Result #1 added</text></g>
<g id="p12" opacity="0"><rect x="-42.4" y="161" width="84.8" height="28" rx="6" fill="#1D9E75" fill-opacity=".18" stroke="#1D9E75" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Result #2</text></g>
<g id="p13" opacity="0"><rect x="-42.4" y="161" width="84.8" height="28" rx="6" fill="#7F77DD" fill-opacity=".18" stroke="#7F77DD" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">Cancel #1</text></g>
<g id="p14" opacity="0"><rect x="-35.2" y="161" width="70.4" height="28" rx="6" fill="#7F77DD" fill-opacity=".18" stroke="#7F77DD" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">close()</text></g>
<g id="p15" opacity="0"><rect x="-67.6" y="161" width="135.2" height="28" rx="6" fill="#888780" fill-opacity=".18" stroke="#888780" stroke-width=".75"/><text class="s fg" x="0" y="175" text-anchor="middle" dominant-baseline="central">forward --remove</text></g>
<g id="c0" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">1. Find the app</text><text class="s mut" x="40" y="274" dominant-baseline="central">adb shell cat /proc/net/unix lists dari_* sockets</text></g>
<g id="c1" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">2. Open the tunnel</text><text class="s mut" x="40" y="274" dominant-baseline="central">adb forward tcp:0 localabstract:dari_&lt;applicationId&gt;</text></g>
<g id="c2" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">3. Connect</text><text class="s mut" x="40" y="274" dominant-baseline="central">The app accepts only uid 2000 (adb shell) or 0 (root)</text></g>
<g id="c3" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">4. Handshake</text><text class="s mut" x="40" y="274" dominant-baseline="central">Frames are a 4-byte length followed by JSON</text></g>
<g id="c4" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">5. Observe</text><text class="s mut" x="40" y="274" dominant-baseline="central">One Invoke, many Results with isFinal = false</text></g>
<g id="c5" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">6. Request and response</text><text class="s mut" x="40" y="274" dominant-baseline="central">Results are matched to requests by id</text></g>
<g id="c6" opacity="0"><text class="t fg" x="40" y="252" dominant-baseline="central">7. Disconnect</text><text class="s mut" x="40" y="274" dominant-baseline="central">Cancel the stream, close, and remove the tunnel</text></g>
</svg>
