@keyframes c0{0%,12.914%{opacity:1}12.950%,100%{opacity:0}}#c0{animation:c0 27.800000000000008s step-end infinite}
@keyframes c1{0%,12.914%{opacity:0}12.950%,25.863%{opacity:1}25.899%,100%{opacity:0}}#c1{animation:c1 27.800000000000008s step-end infinite}
@keyframes c2{0%,25.863%{opacity:0}25.899%,34.137%{opacity:1}34.173%,100%{opacity:0}}#c2{animation:c2 27.800000000000008s step-end infinite}
