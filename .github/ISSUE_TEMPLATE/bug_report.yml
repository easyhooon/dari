name: Bug report
description: Something in the Dari library or the desktop app doesn't work as expected.
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Android library (dari)
        - Desktop app
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Dari version, OS, device or emulator. The desktop app fills this in from Help → Report an Issue….
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Desktop app: attach `dari.log` (Help → Show Log File). Android: relevant logcat lines.
        Remove tokens or personal data first.
      render: text
