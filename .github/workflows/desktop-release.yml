name: Desktop App Release

# Builds the macOS desktop app (Apple Silicon and Intel) and attaches the DMGs and their
# SHA-256 files to the GitHub release for the given tag. Ad-hoc signed, not notarized.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the DMGs to (e.g. 2.0.0)"
        required: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Package DMG
        run: scripts/package-desktop-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.runner }}
          path: dari-desktop-app/build/release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
