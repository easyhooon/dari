name: Desktop App Release

# Builds the desktop app for macOS (Apple Silicon, Intel), Windows (x64) and Linux (x64), smoke-tests
# each build, and attaches the installers and their SHA-256 files to the release for the given tag.
# Developer ID signed and notarized on macOS; unsigned on Windows and Linux.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the installers to (e.g. 2.1.1)"
        required: true
      ref:
        description: "Commit or branch to build from; defaults to the tag. Use it to repackage a release with fixed build scripts."
        required: false

# Actions are pinned to commit SHAs: the publish job holds a token that can write releases.
permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # Installers are named after the catalog version, so a mismatch would mislabel them.
          version="$(sed -n 's/^dariDesktop = "\(.*\)"/\1/p' gradle/libs.versions.toml)"
          if [ "$TAG" != "$version" ]; then
            echo "Tag $TAG does not match dariDesktop $version in gradle/libs.versions.toml" >&2
            exit 1
          fi
      - name: Smoke test
        if: runner.os != 'macOS'
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # xvfb has no GPU; skip Skiko's OpenGL attempt and its fallback warning.
            SKIKO_RENDER_API=SOFTWARE xvfb-run --auto-servernum scripts/smoke-test-desktop-app.sh
          else
            scripts/smoke-test-desktop-app.sh
          fi
      - name: Prepare macOS signing and notarization
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/setup-macos-signing.sh
      - name: Install dmgbuild
        if: runner.os == 'macOS'
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==1.6.7 ds_store==1.3.3 mac_alias==2.2.3
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"
      - name: Package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Enables crash reports; without the secret they stay unavailable.
          DARI_SENTRY_DSN: ${{ secrets.DARI_SENTRY_DSN }}
        run: scripts/package-desktop-app.sh
      - name: Show Compose signing logs
        if: failure() && runner.os == 'macOS'
        run: tail -n 50 dari-desktop-app/build/compose/logs/createReleaseDistributable/*.txt || true
      - name: Remove temporary macOS credentials
        if: always() && runner.os == 'macOS'
        run: |
          keychain="$RUNNER_TEMP/dari-signing.keychain-db"
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
          rm -f "$RUNNER_TEMP/dari-signing.p12" "$RUNNER_TEMP/dari-notary-auth.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-${{ matrix.runner }}
          path: dari-desktop-app/build/release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "$TAG" --notes ""
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
