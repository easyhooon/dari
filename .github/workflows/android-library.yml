name: Android Library

on:
  pull_request:
    paths:
      - "dari/**"
      - "dari-runtime/**"
      - "dari-noop/**"
      - "dari-core/**"
      - "dari-inspector-protocol/**"
      - "sample/**"
      - "scripts/check-dari-api-parity.sh"
      - "detekt-config.yml"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - ".github/workflows/android-library.yml"
  push:
    branches: [main]
    paths:
      - "dari/**"
      - "dari-runtime/**"
      - "dari-noop/**"
      - "dari-core/**"
      - "dari-inspector-protocol/**"
      - "sample/**"
      - "scripts/check-dari-api-parity.sh"
      - "detekt-config.yml"
      - "gradle/**"
      - "gradlew"
      - "build.gradle.kts"
      - ".github/workflows/android-library.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric)
        run: >-
          ./gradlew
          -PskipPublicationSigning
          :dari:testDebugUnitTest
          :dari-runtime:testDebugUnitTest
          :dari-noop:testDebugUnitTest
          :sample:testDebugUnitTest
      - name: Lint
        run: >-
          ./gradlew
          -PskipPublicationSigning
          :dari:ktlintCheck :dari:detekt
          :dari-runtime:ktlintCheck :dari-runtime:detekt
          :dari-noop:ktlintCheck :dari-noop:detekt
          :sample:ktlintCheck :sample:detekt
      # Apps use releaseImplementation(dari-noop), so both must expose the same API.
      - name: API parity and sample builds
        run: >-
          ./gradlew
          -PskipPublicationSigning
          checkDariApiParity
          :sample:assembleDebug
          :sample:assembleRelease
